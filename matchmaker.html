    }
    .pm {

      margin: 0 auto;

    }
    .pm h2 {

      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .pm > p.h {

      font-size: 14px;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1d5db;
      transition: all 0.3s ease;
    }
    .dot.a {
      background: #1a1a1a;
      width: 24px;
      border-radius: 4px;
    }
    .dot.d {
      background: #1a1a1a;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      animation: slideIn 0.35s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .qn {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .qt {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      font-size: 14px;
      color: inherit;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }
    .opt:hover {
      border-color: #9ca3af;
      background: #f3f4f6;
    }
    .opt.sel {
      border-color: #1a1a1a;
      background: #f3f4f6;
    }
    .rd {
      width: 18px;
      height: 18px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .sel .rd {
      border-color: #1a1a1a;
      background: #1a1a1a;
    }
    .sel .rd::after {
      content: '';
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      display: block;
    }
    .cb {
      width: 18px;
      height: 18px;
      border: 2px solid #d1d5db;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .sel .cb {
      border-color: #1a1a1a;
      background: #1a1a1a;
    }
    .sel .cb::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 1px;
      display: block;
    }
    .btns {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .btn {
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }
    .btn-p {
      background: #1a1a1a;
      color: #fff;
    }
    .btn-p:hover { opacity: 0.85; }
    .btn-p:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-g {
      background: transparent;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
    .btn-g:hover { background: #f3f4f6; }
    .tgrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .tgrid .opt {
      padding: 9px 10px;
      font-size: 13px;
    }
    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 10px;
      text-align: center;
    }
    .res {
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

      text-align: center;
      margin-bottom: 20px;
    }

      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;

      font-size: 14px;
      color: #6b7280;

      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: all 0.2s ease;
    }
    .mc:hover {
      border-color: #9ca3af;
      background: #fafafa;
    }
    .rk {
      width: 32px;
      height: 32px;
      border-radius: 50%;

      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;

    .g1 {

    .g2 {
      background: #f3f4f6;

    }
    .g3 {

      color: #dc2626;

    }
    .gx {
      background: #f3f4f6;
      color: #9ca3af;
      border: 1.5px solid #d1d5db;
    }
    .inf { flex: 1; }
    .pn {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .pb {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #f3f4f6;
      color: #6b7280;
    }
    .sc {
      text-align: right;
      flex-shrink: 0;
    }
    .sn {
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .sl {
      font-size: 11px;
      color: #9ca3af;
    }
    .bar {
      width: 50px;
      height: 3px;
      background: #e5e7eb;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .bf {
      height: 100%;
      border-radius: 2px;
      background: #1a1a1a;
      transition: width 0.6s ease;
    }
    .rst {
      display: block;
      margin: 20px auto 0;
      padding: 9px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #1a1a1a;
      color: #fff;
      border: none;
      font-family: inherit;
    }
    .rst:hover { opacity: 0.85; }

      { id: 'ki', t: 'Do you have children at home?', type: 's',
        opts: [
          { v: 'yes', l: 'Yes, I have children', d: 'Need a gentle, kid-friendly pet' },
          { v: 'no', l: 'No children at home', d: 'Open to all temperament types' }
        ]
      },
      { id: 'op', t: 'Do you have other pets at home?', type: 's',
        opts: [
          { v: 'yes', l: 'Yes, other pets present', d: 'Needs to get along with others' },
          { v: 'no', l: 'No other pets', d: 'This will be the only pet' }
        ]
      },
      { id: 'cl', t: 'How much time for daily pet care?', type: 's',
        opts: [
          { v: 'L', l: 'Minimal (1-2 hrs/week)', d: 'Basic feeding, occasional attention' },
          { v: 'M', l: 'Moderate (~1 hr/day)', d: 'Regular interaction, basic grooming' },
          { v: 'H', l: 'Extensive (2+ hrs/day)', d: 'Training, complex care routines' }
        ]
      },
      { id: 'bu', t: 'What is your monthly budget?', type: 's',
        opts: [
          { v: 2000, l: 'Under ₹2,000', d: 'Basic care essentials' },
          { v: 4000, l: '₹2,000 - ₹4,000', d: 'Standard care with extras' },
          { v: 6000, l: '₹4,000 - ₹6,000', d: 'Quality food, regular vet visits' },
          { v: 8000, l: '₹6,000 - ₹8,000', d: 'Premium care and grooming' },
          { v: 10000, l: '₹8,000+', d: 'No budget constraints' }
        ]
      },
      { id: 'ex', t: 'How active is your lifestyle?', type: 's',
        opts: [
          { v: 'L', l: 'Relaxed & homebody', d: 'Quiet time at home' },
          { v: 'M', l: 'Moderately active', d: 'Daily walks, some outdoor time' },
          { v: 'H', l: 'Very active & outdoorsy', d: 'Running, hiking, lots of exercise' }
        ]
      },
      { id: 'gr', t: 'How much time for grooming?', type: 's',
        opts: [
          { v: 'L', l: 'Minimal grooming', d: 'Occasional brushing' },
          { v: 'M', l: 'Weekly grooming', d: 'Regular brushing, basic maintenance' },
          { v: 'H', l: 'Daily grooming routine', d: 'Willing to invest in coat care' }
        ]
      },
      { id: 'sz', t: 'What size pet do you prefer?', type: 's',
        opts: [
          { v: 'tiny', l: 'Tiny (under 1 kg)', d: 'Hamsters, small reptiles' },
          { v: 'small', l: 'Small (1-10 kg)', d: 'Cats, small dogs, rabbits' },
          { v: 'medium', l: 'Medium (10-30 kg)', d: 'Medium dog breeds' },
          { v: 'large', l: 'Large (30+ kg)', d: 'Big dogs, giant breeds' }
        ]
      },
      { id: 'tp', t: 'Which personality traits appeal to you?', type: 'm',
        opts: ['Affectionate','Playful','Gentle','Intelligent','Active','Loyal','Calm','Social','Quiet','Friendly','Curious','Independent','Energetic','Shy','Outgoing'].map(x => ({ v: x, l: x }))
      },
      { id: 'lf', t: 'How long-term is your commitment?', type: 's',
        opts: [
          { v: 'short', l: 'Short-term (2-5 years)', d: 'Testing the waters' },
          { v: 'medium', l: 'Medium-term (5-10 years)', d: 'A significant chapter' },
          { v: 'long', l: 'Long-term (10-16 years)', d: 'A lifetime companion' }
        ]
      }
    ];

    let cur = 0;
    let ans = {};

    const $ = id => document.getElementById(id);

    function renderDots() {
      $('D').innerHTML = Q.map((_, i) =>
        `<div class="dot ${i === cur ? 'a' : i < cur ? 'd' : ''}"></div>`
      ).join('');
    }

    function renderQ() {
      const q = Q[cur];
      const sel = ans[q.id] || [];
      let html = `<div class="card"><div class="qn">Question ${cur + 1} of ${Q.length}</div><div class="qt">${q.t}</div><div class="opts ${q.type === 'm' ? 'tgrid' : ''}">`;
      q.opts.forEach(o => {
        const isSel = q.type === 's' ? sel === o.v : sel.includes(o.v);
        html += `<button class="opt ${isSel ? 'sel' : ''}" onclick="pick('${q.id}','${o.v}',${q.type === 'm'})">
          <div class="${q.type === 'm' ? 'cb' : 'rd'}"></div>
          <div>
            <div style="font-weight:600">${o.l}</div>
            ${o.d ? `<div style="font-size:12px;color:#6b7280;margin-top:2px">${o.d}</div>` : ''}
          </div>
        </button>`;
      });
      html += `</div><div class="btns">`;
      if (cur > 0) html += `<button class="btn btn-g" onclick="prev()">Back</button>`;
      else html += `<div></div>`;
      const ok = q.type === 's' ? sel !== undefined : sel.length > 0;
      const lbl = cur === Q.length - 1 ? 'See matches' : 'Next';
      html += `<button class="btn btn-p" ${!ok ? 'disabled' : ''} onclick="next()">${lbl}</button></div></div>`;
      if (q.type === 'm') html += `<div class="hint">Select up to 3 traits (${sel.length || 0}/3 selected)</div>`;
      $('C').innerHTML = html;
      renderDots();
    }

    function pick(id, v, multi) {
      if (multi) {
        let arr = ans[id] || [];
        if (arr.includes(v)) arr = arr.filter(x => x !== v);
        else if (arr.length < 3) arr.push(v);
        ans[id] = arr;
      } else {
        ans[id] = v;
      }
      renderQ();
    }

    function prev() {
      if (cur > 0) { cur--; renderQ(); }
    }

    function next() {
      if (cur < Q.length - 1) { cur++; renderQ(); }
      else { showRes(); }
    }

    // Scoring helpers
    function szCat(w) { return w < 1 ? 'tiny' : w < 10 ? 'small' : w < 30 ? 'medium' : 'large'; }
    function lfCat(l) { return l < 5 ? 'short' : l < 10 ? 'medium' : 'long'; }
    function lvDist(a, b) { const o = { L: 0, M: 1, H: 2 }; return Math.abs((o[a] || 0) - (o[b] || 0)); }

    function score(p) {
      let s = 0, max = 100;

      // species
      if (ans.sp && p[2] === ans.sp) s += 15;

      // kids (hard filter)
      if (ans.ki === 'yes' && !p[10]) return -1;
      if (ans.ki === 'yes' && p[10]) s += 10;

      // other pets (hard filter)
      if (ans.op === 'yes' && !p[11]) return -1;
      if (ans.op === 'yes' && p[11]) s += 10;

      // care level
      if (ans.cl) { const d = lvDist(p[6], ans.cl); s += d === 0 ? 10 : d === 1 ? 5 : 0; }

      // budget
      if (ans.bu) { const b = +ans.bu; if (p[7] <= b) s += 10; else if (p[7] <= b + 1500) s += 5; }

      // exercise
      if (ans.ex) { const d = lvDist(p[8], ans.ex); s += d === 0 ? 10 : d === 1 ? 5 : 0; }

      // grooming
      if (ans.gr) { const d = lvDist(p[9], ans.gr); s += d === 0 ? 10 : d === 1 ? 5 : 0; }

      // size
      if (ans.sz) {
        const sc = szCat(p[4]);
        if (sc === ans.sz) s += 10;
        else if ((sc === 'small' && ans.sz === 'tiny') || (sc === 'medium' && ans.sz === 'small') || (sc === 'large' && ans.sz === 'medium')) s += 5;
      }

      // temperament (multi-select, up to 3)
      if (ans.tp && ans.tp.length > 0) {
        const pt = p[12].toLowerCase();
        ans.tp.forEach(t => { if (pt.includes(t.toLowerCase())) s += 4; });
      }

      // lifespan
      if (ans.lf) {
        const lc = lfCat(p[5]);
        if (lc === ans.lf) s += 10;
        else if ((lc === 'short' && ans.lf === 'medium') || (lc === 'medium' && ans.lf === 'long')) s += 5;
      }

      return Math.round((s / max) * 100);
    }

    function showRes() {
      const ranked = P.map(p => {
        const sc = score(p);
        return sc >= 0 ? { p, sc } : null;
      }).filter(x => x).sort((a, b) => b.sc - a.sc).slice(0, 5);

      let html = `<div class="res"><div class="rh"><h3>Your Top Matches</h3><p>Based on your preferences, here are your best companions</p></div>`;

      ranked.forEach((r, i) => {
        const p = r.p;
        const g = i === 0 ? 'g1' : i === 1 ? 'g2' : i === 2 ? 'g3' : 'gx';
        const sz = p[4] < 1 ? (p[4] * 1000) + 'g' : p[4] + ' kg';

        html += `<div class="mc">
          <div class="rk ${g}">${i + 1}</div>
          <div class="inf">
            <div class="pn">${p[1]} <span style="color:#9ca3af;font-weight:400">(${p[2]})</span></div>
            <div class="pb">${p[3]} &middot; ${sz} &middot; ${p[5]} yrs lifespan</div>
            <div class="tags">
              <span class="tag">Care: ${p[6] === 'L' ? 'Low' : p[6] === 'M' ? 'Medium' : 'High'}</span>
              <span class="tag">₹${p[7]}/mo</span>
              <span class="tag">${p[8] === 'L' ? 'Low' : p[8] === 'M' ? 'Medium' : 'High'} exercise</span>
              <span class="tag">${p[9] === 'L' ? 'Low' : p[9] === 'M' ? 'Medium' : 'High'} grooming</span>
            </div>
          </div>
          <div class="sc">
            <div class="sn">${r.sc}%</div>
            <div class="sl">match</div>
            <div class="bar"><div class="bf" style="width:${r.sc}%"></div></div>
          </div>
        </div>`;
      });

      html += `<button class="rst" onclick="restart()">Start over</button></div>`;
      $('C').innerHTML = html;
      $('D').innerHTML = Q.map(() => '<div class="dot d"></div>').join('');
    }

    function restart() {
      cur = 0;
      ans = {};
      renderQ();
    }

    // Expose handlers to global scope for inline onclick
    window.pick = pick;
    window.prev = prev;
    window.next = next;
    window.restart = restart;

    // Start
    renderQ();
  </script>
</body>
</html>
