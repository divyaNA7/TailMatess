<style id="tailmates-mobile-responsive">

  input, select, textarea { font-size: 16px !important; }
  button, .btn, [role="button"], input[type="submit"], input[type="button"] {
    min-height: 44px;
    touch-action: manipulation;
  }
  .cursor, .cursor-follower { display: none !important; }
  body { cursor: auto !important; }

    width: 100%;

  .navbar .nav-links li { width: 100%; list-style: none; }
  .navbar .nav-links a {
    display: flex !important;

  .navbar .nav-links a:focus-visible { background: rgba(255,255,255,.08); }

  .container, .page-wrapper, .content-wrapper, .main-content, main,

  .container { padding-left: 1rem !important; padding-right: 1rem !important; }
  main, .page-wrapper { padding-left: 1rem; padding-right: 1rem; }
  section { min-width: 0; }
  h1 { overflow-wrap: anywhere; font-size: clamp(1.7rem, 7vw, 2.5rem); }
  h2 { overflow-wrap: anywhere; }
  p, label, a, li { overflow-wrap: anywhere; }
  /* Collapse multi-column content instead of allowing horizontal page overflow. */
  [style*="grid-template-columns"], [class*="grid"] {
    min-width: 0;
  }
  [style*="grid-template-columns"] { grid-template-columns: minmax(0, 1fr) !important; }
  [class*="grid"] { column-gap: 1rem; }
  .footer-grid, .pet-grid, .pets-grid, .services-grid, .product-grid,
  .applications-grid, .cards-grid, .stats-grid, .dashboard-grid {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .resp-grid-2, .resp-grid-sidebar { grid-template-columns: minmax(0, 1fr) !important; }
  .resp-flex-col { flex-direction: column !important; align-items: stretch !important; }
  .resp-full { width: 100% !important; max-width: 100% !important; }
  .hero, .hero-content, .hero-inner, .hero-section {

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div>TailMates</div>
    <div class="nav-links">
      <a href="index">Home</a>

      <a href="services">Services</a>
      <a href="shop">Shop</a>

    </div>

  <!-- Forgot Password Form -->
  <form class="w-full max-w-md glass-effect rounded-lg shadow-lg p-8" action="/reset-password" method="POST">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Forgot Password</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Enter your email and we’ll send you a reset link</p>

    <input type="email" name="email" placeholder="Your email address" required
      class="w-full mb-6 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7E0CF5]">

    <button type="submit"
      class="w-full purple-button text-white py-2 px-4 rounded-md hover:bg-[#690acc] focus:outline-none focus:ring-2 focus:ring-[#7E0CF5]">
      Send Reset Link
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
      Changed your mind? <a href="login.html" class="purple-link">Go back to Login</a>
    </p>
  </form>


<script id="tailmates-mobile-navigation">

/* Mobile navigation enhancement; desktop navigation is untouched. */
(function () {
  function setupTailMatesMobileNav() {
    document.querySelectorAll('.navbar').forEach(function (nav, index) {
      var links = nav.querySelector('.nav-links');
      if (!links || nav.querySelector('.tm-mobile-toggle')) return;

      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'tm-mobile-toggle';
      toggle.setAttribute('aria-label', 'Open navigation menu');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.innerHTML = '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
      toggle.style.display = 'none';

      var anchor = nav.querySelector('.nav-inner') || nav;
      anchor.appendChild(toggle);
      nav.classList.add('tm-mobile-nav-ready');

      function closeMenu() {
        nav.classList.remove('tm-menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.innerHTML = '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
      }
      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('tm-menu-open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
        toggle.innerHTML = open
          ? '<i class="fa-solid fa-xmark" aria-hidden="true"></i>'
          : '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
      });
      links.addEventListener('click', function (event) {
        if (event.target.closest('a')) closeMenu();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeMenu();
      });
      window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeMenu();
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupTailMatesMobileNav);
  } else {
    setupTailMatesMobileNav();
  }
})();

</script>
</body>
